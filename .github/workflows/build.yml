name: build-apk

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK 与 NDK
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          cd "$HOME/android-sdk/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-*.zip
          mv cmdline-tools latest
          yes | latest/bin/sdkmanager --sdk_root="$HOME/android-sdk" \
            "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" > /dev/null
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"

      - name: 构建 APK
        run: |
          set -o pipefail
          chmod +x build.sh
          ./build.sh 2>&1 | tee build.log

      - name: 失败时把日志推到 ci-log 分支
        if: failure()
        run: |
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -f build.log || true
          git commit -m "build log $GITHUB_RUN_ID" || true
          git push -f origin HEAD:ci-log

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ndk-hello-apk
          path: ndk-hello.apk
          retention-days: 7
